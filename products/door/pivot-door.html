<head>

    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <style>
        /* Breadcrumbs */
        .breadcrumb-bar {
            background: #f5f5f5;
            padding: 12px 0;
            border-bottom: 1px solid #e8e8e8;
        }
        .breadcrumb-bar .container {
            display: flex;
            align-items: center;
            gap: 0;
            font-size: 12px;
            color: #999;
        }
        .breadcrumb-bar a {
            color: #999;
            text-decoration: none;
            transition: color 0.2s;
        }
        .breadcrumb-bar a:hover {
            color: #d59203;
        }
        .breadcrumb-bar .sep {
            margin: 0 8px;
            color: #ccc;
        }
        .breadcrumb-bar .current {
            color: #666;
            font-weight: 500;
        }

        /* Secondary Nav */
        .secondary-nav {
            background: #f0f0f0;
            border-bottom: 2px solid #e0e0e0;
            position: sticky;
            top: 60px;
            z-index: 100;
        }
        .secondary-nav .container {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
        }
        .sec-nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 20px;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            text-decoration: none;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .sec-nav-item i {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        .sec-nav-item:hover {
            color: #d59203;
        }
        .sec-nav-item.active {
            color: #d59203;
            border-bottom-color: #d59203;
            font-weight: 600;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 50px 0;
        }
        .product-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            display: block;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        .product-card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .product-card-body {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .product-card-title {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 16px;
            color: #333;
            font-weight: 600;
            margin: 0;
        }
        .badge-new {
            display: inline-block;
            background: #d59203;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* WhatsApp FAB */
        .whatsapp-fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 56px;
            height: 56px;
            background: #25D366;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 20px rgba(37,211,102,0.4);
            z-index: 9999;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
        }
        .whatsapp-fab:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 28px rgba(37,211,102,0.5);
        }

        @media (max-width: 768px) {
            .secondary-nav .container {
                overflow-x: auto;
                justify-content: flex-start;
                gap: 0;
            }
            .sec-nav-item {
                padding: 14px 15px;
                font-size: 12px;
            }
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }
        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
